<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 三色光晕，呼应 logo 的发光圆点 -->
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff4d4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fadb14" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fadb14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52c41a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#52c41a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色圆角底，与站点深色主题一致 -->
  <rect width="64" height="64" rx="14" fill="#08080f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1f1f30" stroke-width="2"/>

  <!-- 竖排红绿灯 -->
  <circle cx="32" cy="15" r="12" fill="url(#glow-red)"/>
  <circle cx="32" cy="15" r="7" fill="#ff4d4f"/>

  <circle cx="32" cy="32" r="12" fill="url(#glow-yellow)"/>
  <circle cx="32" cy="32" r="7" fill="#fadb14"/>

  <circle cx="32" cy="49" r="12" fill="url(#glow-green)"/>
  <circle cx="32" cy="49" r="7" fill="#52c41a"/>
</svg>
